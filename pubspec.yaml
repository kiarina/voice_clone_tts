name: voice_clone_tts
description: "Voice cloning text-to-speech for Flutter: Qwen3-TTS through qwentts.cpp (ggml), Metal on macOS and CUDA on Windows."
version: 0.1.0
repository: https://github.com/kiarina/voice_clone_tts
issue_tracker: https://github.com/kiarina/voice_clone_tts/issues

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^2.1.0
  crypto: ^3.0.6
  ffi: ^2.1.3
  hooks: ^2.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
